name: Upgrade Next.js security dependency
on:
  push:
    paths:
      - '.github/workflows/upgrade-next-security.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Upgrade Next.js and regenerate lockfile
        run: npm install next@16.4.0 --save-exact --package-lock=true
      - name: Verify production dependency security
        run: npm audit --omit=dev --audit-level=high
      - name: Verify lockfile is reproducible
        run: npm ci --ignore-scripts
      - name: Commit dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git commit -m "Upgrade Next.js to 16.4.0 and refresh npm lockfile"
          git push origin HEAD:main
