name: Restore compatible Next.js Cloudflare runtime
on:
  push:
    paths:
      - '.github/workflows/upgrade-next-security.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Restore previous Next.js runtime version
        run: |
          npm install next@16.3.6 --save-exact --package-lock=true
          node -e 'const p=require("./package.json"); if(p.dependencies.next!=="16.3.6") process.exit(1)'
      - name: Record temporary security advisory for emergency availability recovery
        run: npm audit --omit=dev --audit-level=high || echo 'Security audit requires follow-up after service recovery'
      - name: Verify reproducible dependency installation
        run: npm ci --ignore-scripts
      - name: Commit compatible Next.js and lockfile together
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "::error::No dependency change produced"
            exit 1
          fi
          git commit -m "Emergency restore Next.js 16.3.6 runtime compatibility"
          git push origin HEAD:main
