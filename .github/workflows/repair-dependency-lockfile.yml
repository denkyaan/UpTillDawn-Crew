name: Repair dependency lockfile

on:
  push:
    branches: [staging]
    paths:
      - ".github/workflows/repair-dependency-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate lockfile from declared dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Check reproducible install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): synchronize Next.js 16.4.2 lockfile"
          git push origin HEAD:staging
