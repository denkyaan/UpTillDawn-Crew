name: Refresh Next.js security lockfile

on:
  push:
    branches: ['feat/admin-portal-dashboard-v22']
    paths:
      - package.json
      - .github/workflows/refresh-next-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-next-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Regenerate dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate clean installation and security
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
      - name: Commit verified lockfile
        id: commit
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: regenerate lockfile for Next.js 16.4.2"
          git push origin HEAD:${{ github.ref_name }}
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Start full CI on updated commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${{ github.ref_name }}"
