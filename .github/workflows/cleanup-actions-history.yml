name: Cleanup Actions History

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove unsuccessful historical runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          delete_runs () {
            local workflow="$1"
            shift
            for conclusion in "$@"; do
              while :; do
                ids="$(gh api -H "Accept: application/vnd.github+json"                   "/repos/$REPO/actions/workflows/$workflow/runs?status=$conclusion&per_page=100"                   --jq '.workflow_runs[].id' 2>/dev/null || true)"
                [ -z "$ids" ] && break
                deleted=0
                while read -r id; do
                  [ -z "$id" ] && continue
                  [ "$id" = "$CURRENT_RUN_ID" ] && continue
                  gh api --method DELETE "/repos/$REPO/actions/runs/$id"
                  deleted=$((deleted+1))
                done <<< "$ids"
                [ "$deleted" -eq 0 ] && break
              done
            done
          }
          delete_runs "ci.yml" failure cancelled
          delete_runs "deploy-cloudflare.yml" failure cancelled skipped
