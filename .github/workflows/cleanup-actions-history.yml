name: Cleanup Actions History
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Retain newest completed run per workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "/repos/$REPO/actions/workflows?per_page=100" --jq '.workflows[].id' | while read -r workflow; do
            [ -n "$workflow" ] || continue
            echo "Checking workflow $workflow"
            kept=0
            gh api --paginate "/repos/$REPO/actions/workflows/$workflow/runs?per_page=100" --jq '.workflow_runs[] | select(.status == "completed") | .id' | while read -r id; do
              [ -n "$id" ] || continue
              [ "$id" = "$CURRENT_RUN_ID" ] && continue
              if [ "$kept" -eq 0 ]; then
                kept=1
                echo "Keeping latest completed run $id"
              else
                echo "Removing older completed run $id"
                gh api --method DELETE "/repos/$REPO/actions/runs/$id"
              fi
            done
          done
