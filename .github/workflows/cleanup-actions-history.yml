name: Cleanup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-actions-history.yml'
  schedule:
    - cron: '17 3 * * *'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Retain latest success and failure for each workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          failures=0
          workflows="$(gh api --paginate "/repos/$REPO/actions/workflows?per_page=100" --jq '.workflows[].id')"
          while IFS= read -r workflow; do
            [ -n "$workflow" ] || continue
            if ! response="$(gh api --paginate --slurp "/repos/$REPO/actions/workflows/$workflow/runs?per_page=100&status=completed")"; then
              echo "::error::Could not fetch completed runs for workflow $workflow"
              failures=$((failures + 1))
              continue
            fi
            if ! entries="$(printf '%s' "$response" | jq -r '[.[].workflow_runs[] | select(.id != null)] | unique_by(.id) | sort_by(.created_at, .id) | reverse | .[] | [.id, (.head_branch // ""), (.conclusion // "")] | @tsv')"; then
              echo "::error::Could not parse completed runs for workflow $workflow"
              failures=$((failures + 1))
              continue
            fi
            kept_success=0
            kept_failure=0
            removed=0
            while IFS=$'\t' read -r id branch conclusion; do
              [ -n "$id" ] || continue
              [ "$id" = "$CURRENT_RUN_ID" ] && continue
              if [ "$branch" = "main" ] && [ "$conclusion" = "success" ] && [ "$kept_success" -eq 0 ]; then
                kept_success=1
                continue
              fi
              if [ "$branch" = "main" ] && [ "$conclusion" != "success" ] && [ "$kept_failure" -eq 0 ]; then
                kept_failure=1
                continue
              fi
              if gh api --method DELETE "/repos/$REPO/actions/runs/$id"; then
                removed=$((removed + 1))
              else
                echo "::error::Could not delete completed run $id"
                failures=$((failures + 1))
              fi
            done <<< "$entries"
            echo "Workflow $workflow: removed $removed obsolete completed runs"
          done <<< "$workflows"
          if [ "$failures" -ne 0 ]; then
            echo "::error::Cleanup had $failures API errors"
            exit 1
          fi
