name: Cleanup Actions History
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Retain newest completed run per workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          # Retain exactly one latest completed run per workflow,
          # whether successful or failed. Never remove active/current runs.
          workflows="$(gh api "/repos/$REPO/actions/workflows?per_page=100" --jq '.workflows[].id')"
          while IFS= read -r workflow; do
            [ -n "$workflow" ] || continue
            echo "Checking workflow $workflow"
            # One bounded API response per workflow avoids fragile paginated pipes.
            if ! response="$(gh api "/repos/$REPO/actions/workflows/$workflow/runs?per_page=100&status=completed")"; then
              echo "::warning::Could not fetch runs for workflow $workflow; skipping"
              continue
            fi
            if ! entries="$(printf '%s' "$response" | jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[] | [.id,.created_at] | @tsv')"; then
              echo "::warning::Invalid workflow response for $workflow; skipping"
              continue
            fi
            kept=0
            while IFS=$'\t' read -r id created; do
              [ -n "$id" ] || continue
              kept=$((kept + 1))
              [ "$id" = "$CURRENT_RUN_ID" ] && continue
              [ "$kept" -le 1 ] && continue

              echo "Removing old completed run $id"
              if ! gh api --method DELETE "/repos/$REPO/actions/runs/$id"; then
                echo "::warning::Could not delete run $id; continuing"
              fi
            done <<< "$entries"
          done <<< "$workflows"
