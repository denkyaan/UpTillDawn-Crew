name: Cleanup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-actions-history.yml'
  workflow_run:
    workflows: ["CI main", "Deploy main", "CI production", "Deploy production"]
    types: [completed]
  schedule:
    - cron: '17 3 * * *'

# Serialize all cleanup runs. Never cancel a running cleanup.
concurrency:
  group: cleanup-actions-history
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Do not check out or execute any code from a triggering pull request.
      - name: Retain only the newest successful or failed run per workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          plan() {
            jq -c --arg current "$CURRENT_RUN_ID" --arg workflow "$1" '
              [.[].workflow_runs[] | select(.id != null)] | unique_by(.id) |
              map(select(.status == "completed" and (.id | tostring) != $current)) |
              sort_by(.run_number, .created_at, .id) | reverse |
              . as $completed |
              (if $workflow == "cleanup-actions-history.yml" then null
               else (map(select(.conclusion == "success" or .conclusion == "failure")) | .[0].id)
               end) as $keep |
              {keep: $keep, delete: [$completed[] | select(.id != $keep) | .id]}
            '
          }

          # Fail before deleting anything if the retention policy regresses.
          fixture='[{"workflow_runs":[{"id":9,"run_number":9,"status":"in_progress"},{"id":8,"run_number":8,"status":"completed","conclusion":"cancelled"},{"id":7,"run_number":7,"status":"completed","conclusion":"failure","head_branch":"feature"},{"id":5,"run_number":5,"status":"completed","conclusion":"success","head_branch":"main"}]},{"workflow_runs":[{"id":5,"run_number":5,"status":"completed","conclusion":"success"},{"id":4,"run_number":4,"status":"queued"}]}]'
          CURRENT_RUN_ID=99 plan fast-change-validation.yml <<< "$fixture" | jq -e '.keep == 7 and .delete == [8,5]' >/dev/null
          CURRENT_RUN_ID=99 plan cleanup-actions-history.yml <<< "$fixture" | jq -e '.keep == null and .delete == [8,7,5]' >/dev/null
          CURRENT_RUN_ID=7 plan fast-change-validation.yml <<< "$fixture" | jq -e '.keep == 5 and .delete == [8]' >/dev/null
          CURRENT_RUN_ID=99 plan ci.yml <<< '[{"workflow_runs":[{"id":1,"run_number":1,"status":"completed","conclusion":"cancelled"}]}]' | jq -e '.keep == null and .delete == [1]' >/dev/null

          failures=0

          # Historical runs can survive removal of their workflow file. Resolve
          # the five active workflow IDs first, then sweep retired IDs across
          # the repository, preserving every active run.
          approved_ids=()
          for workflow in fast-change-validation.yml deploy-main.yml ci.yml deploy-cloudflare.yml cleanup-actions-history.yml; do
            workflow_id="$(gh api "/repos/$REPO/actions/workflows/$workflow" --jq '.id')"
            if ! [[ "$workflow_id" =~ ^[0-9]+$ ]]; then
              echo "::error::Could not resolve approved workflow $workflow"
              exit 1
            fi
            approved_ids+=("$workflow_id")
          done
          protected="$(printf '%s\n' "${approved_ids[@]}" | jq -s 'unique')"
          jq -e 'length == 5' <<< "$protected" >/dev/null
          retired_plan() {
            jq -c --argjson protected "$1" --arg current "$CURRENT_RUN_ID" '
              [.[].workflow_runs[] | select(.id != null and (.workflow_id | type) == "number")] |
              unique_by(.id) |
              map(select(.status == "completed" and (.id | tostring) != $current
                and (.workflow_id as $w | ($protected | index($w)) == null))) |
              map(.id)
            '
          }
          retired_fixture='[{"workflow_runs":[{"id":1,"workflow_id":11,"status":"completed"},{"id":2,"workflow_id":99,"status":"completed"},{"id":3,"workflow_id":99,"status":"in_progress"},{"id":4,"workflow_id":99,"status":"completed"}]},{"workflow_runs":[{"id":2,"workflow_id":99,"status":"completed"}]}]'
          CURRENT_RUN_ID=4 retired_plan '[11,12,13,14,15]' <<< "$retired_fixture" | jq -e '. == [2]' >/dev/null
          if ! history="$(gh api --paginate --slurp "/repos/$REPO/actions/runs?per_page=100")"; then
            echo "::error::Could not fetch repository-wide run history"
            exit 1
          fi
          if ! jq -e 'type == "array" and length > 0 and all(.[]; (.workflow_runs | type) == "array")' <<< "$history" >/dev/null; then
            echo "::error::Invalid repository-wide history"
            exit 1
          fi
          retired="$(retired_plan "$protected" <<< "$history" | jq -r '.[]')"
          removed=0
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            [ "$id" != "$CURRENT_RUN_ID" ] || continue
            # Check live identity and status again before deletion.
            if ! run="$(gh api "/repos/$REPO/actions/runs/$id")"; then
              echo "::error::Could not verify retired run $id"
              failures=$((failures + 1))
              continue
            fi
            if ! jq -e --argjson protected "$protected" '.status == "completed" and (.workflow_id | type) == "number" and (.workflow_id as $w | ($protected | index($w)) == null)' <<< "$run" >/dev/null; then
              echo "Preserving active or approved run $id"
              continue
            fi
            if gh api --method DELETE "/repos/$REPO/actions/runs/$id" >/dev/null; then
              removed=$((removed + 1))
            else
              echo "::error::Could not delete retired run $id"
              failures=$((failures + 1))
            fi
          done <<< "$retired"
          echo "Retired workflows: removed $removed obsolete completed runs"

          # Scope strictly to the five approved workflows. Cleanup goes last:
          # its current run will become its sole result once it completes.
          for workflow in fast-change-validation.yml deploy-main.yml ci.yml deploy-cloudflare.yml cleanup-actions-history.yml; do
            # Unfiltered pagination avoids the 1,000-result search limit
            # associated with status filters; filter completed runs locally.
            if ! response="$(gh api --paginate --slurp "/repos/$REPO/actions/workflows/$workflow/runs?per_page=100")"; then
              echo "::error::Could not fetch history for $workflow"
              failures=$((failures + 1))
              continue
            fi
            if ! jq -e 'type == "array" and length > 0 and all(.[]; (.workflow_runs | type) == "array")' <<< "$response" >/dev/null; then
              echo "::error::Invalid history response for $workflow"
              failures=$((failures + 1))
              continue
            fi
            if ! selection="$(plan "$workflow" <<< "$response")"; then
              echo "::error::Could not calculate retention for $workflow"
              failures=$((failures + 1))
              continue
            fi
            keep="$(jq -r '.keep // "none"' <<< "$selection")"
            obsolete="$(jq -r '.delete[]' <<< "$selection")"
            removed=0
            while IFS= read -r id; do
              [ -n "$id" ] || continue
              [ "$id" != "$CURRENT_RUN_ID" ] || continue
              # Recheck to protect runs that were rerun after the snapshot.
              if ! status="$(gh api "/repos/$REPO/actions/runs/$id" --jq '.status')"; then
                echo "::error::Could not verify status for run $id"
                failures=$((failures + 1))
                continue
              fi
              if [ "$status" != "completed" ]; then
                echo "Preserving active run $id ($status)"
                continue
              fi
              if gh api --method DELETE "/repos/$REPO/actions/runs/$id" >/dev/null; then
                removed=$((removed + 1))
              else
                echo "::error::Could not delete completed run $id"
                failures=$((failures + 1))
              fi
            done <<< "$obsolete"
            echo "$workflow: kept $keep; removed $removed obsolete completed runs"
          done
          if [ "$failures" -ne 0 ]; then
            echo "::error::Cleanup had $failures API errors"
            exit 1
          fi
