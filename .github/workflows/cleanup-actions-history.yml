name: Cleanup Actions History

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Retain recent completed runs for every workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          # Retain only the newest completed run per workflow.\n          mapfile -t workflows < <(gh api --paginate "/repos/$REPO/actions/workflows?per_page=100" --jq '.workflows[].id')
          for workflow in "${workflows[@]}"; do
            echo "::group::Workflow $workflow"
            mapfile -t runs < <(gh api --paginate "/repos/$REPO/actions/workflows/$workflow/runs?per_page=100" --jq '.workflow_runs[] | [.id,.status,.created_at] | @tsv')
            kept=0
            for run in "${runs[@]}"; do
              IFS=
          done
\t' read -r id status created <<< "$run"
              [ "$id" = "$CURRENT_RUN_ID" ] && continue
              [ "$status" = "completed" ] || continue
              kept=$((kept + 1))
              [ "$kept" -eq 1 ] && continue
              echo "Deleting superseded completed run $id"
              gh api --method DELETE "/repos/$REPO/actions/runs/$id"
            done
            echo "::endgroup::"
          done
