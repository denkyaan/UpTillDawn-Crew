name: Cleanup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-actions-history.yml'
  schedule:
    - cron: '17 3 * * *'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Retain latest success and failure for each workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          failures=0
          workflows="$(gh api --paginate "/repos/$REPO/actions/workflows?per_page=100" --jq '.workflows[].id')"
          while IFS= read -r workflow; do
            [ -n "$workflow" ] || continue
            if ! response="$(gh api --paginate --slurp "/repos/$REPO/actions/workflows/$workflow/runs?per_page=100&status=completed")"; then
              echo "::error::Could not fetch completed runs for workflow $workflow"
              failures=$((failures + 1))
              continue
            fi
            if ! entries="$(printf '%s' "$response" | jq -r '[.[].workflow_runs[] | select(.id != null)] | unique_by(.id) | sort_by(.created_at, .id) | reverse | .[] | [.id, (.head_branch // ""), (.conclusion // "")] | @tsv')"; then
              echo "::error::Could not parse completed runs for workflow $workflow"
              failures=$((failures + 1))
              continue
            fi
            kept_success=0
            kept_failure=0
            removed=0
            while IFS=$'\t' read -r id branch conclusion; do
              [ -n "$id" ] || continue
              [ "$id" = "$CURRENT_RUN_ID" ] && continue
              if [ "$branch" = "main" ] && [ "$conclusion" = "success" ] && [ "$kept_success" -eq 0 ]; then
                kept_success=1
                continue
              fi
              if [ "$branch" = "main" ] && [ "$conclusion" != "success" ] && [ "$kept_failure" -eq 0 ]; then
                kept_failure=1
                continue
              fi
              if gh api --method DELETE "/repos/$REPO/actions/runs/$id"; then
                removed=$((removed + 1))
              else
                echo "::error::Could not delete completed run $id"
                failures=$((failures + 1))
              fi
            done <<< "$entries"
            echo "Workflow $workflow: removed $removed obsolete completed runs"
          done <<< "$workflows"
          if [ "$failures" -ne 0 ]; then
            echo "::error::Cleanup had $failures API errors"
            exit 1
          fi

  retire-staging-worker:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Retire obsolete staging Worker after main-test health check
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Missing CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing CLOUDFLARE_ACCOUNT_ID}"
          main_url="https://uptilldawn-main.uptilldawn.workers.dev/login"
          status="$(curl --retry 3 --retry-all-errors -sS --max-time 30 -o /tmp/main-check -w '%{http_code}' "$main_url")"
          if [ "$status" != "200" ] || [ ! -s /tmp/main-check ]; then
            echo "::error::Main-test health gate failed: HTTP $status; staging retained"
            exit 1
          fi
          worker="uptilldawn-crew-staging"
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker"
          status="$(curl -sS --max-time 30 -o /tmp/worker-delete -w '%{http_code}' -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$endpoint")"
          if [ "$status" = "404" ]; then
            echo "Staging Worker already absent"
            exit 0
          fi
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Cloudflare staging deletion HTTP $status"
            head -c 500 /tmp/worker-delete
            exit 1
          fi
          node --input-type=module -e '
            import fs from "node:fs";
            const result = JSON.parse(fs.readFileSync("/tmp/worker-delete", "utf8"));
            if (!result.success) {
              console.error("::error::Cloudflare rejected staging deletion");
              process.exit(1);
            }
            console.log("Deleted obsolete staging Worker: uptilldawn-crew-staging");
          '
