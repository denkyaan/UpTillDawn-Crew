name: Contract PDF renderer

on:
  push:
    branches: [staging]
    paths:
      - 'services/contract-pdf-renderer/**'
      - '.github/workflows/contract-pdf-renderer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-pdf-renderer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/contract-pdf-renderer
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Install renderer dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Check syntax
        run: node --check server.mjs && node --check smoke-test.mjs
      - name: Exercise renderer HTTP API and PDF output
        run: npm test
