name: Full Authenticated Portal Regression
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Main Test App"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  browser-e2e:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_BASE_URL: https://uptilldawn-main.uptilldawn.workers.dev
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_ADMINISTRATION_EMAIL: ${{ secrets.E2E_ADMINISTRATION_EMAIL }}
      E2E_ADMINISTRATION_PASSWORD: ${{ secrets.E2E_ADMINISTRATION_PASSWORD }}
      E2E_STAFF_EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
      E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
      E2E_RESPONSIBLE_EMAIL: ${{ secrets.E2E_RESPONSIBLE_EMAIL }}
      E2E_RESPONSIBLE_PASSWORD: ${{ secrets.E2E_RESPONSIBLE_PASSWORD }}
      E2E_PROMOTION_EMAIL: ${{ secrets.E2E_PROMOTION_EMAIL }}
      E2E_PROMOTION_PASSWORD: ${{ secrets.E2E_PROMOTION_PASSWORD }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Diagnose test configuration without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in E2E_BASE_URL E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD E2E_ADMINISTRATION_EMAIL E2E_ADMINISTRATION_PASSWORD E2E_STAFF_EMAIL E2E_STAFF_PASSWORD E2E_RESPONSIBLE_EMAIL E2E_RESPONSIBLE_PASSWORD E2E_PROMOTION_EMAIL E2E_PROMOTION_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              echo "::error title=Missing test configuration::Configure repository Actions secret or variable $key"
              missing=1
            else
              echo "Configured: $key"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Authenticated browser regression cannot run without isolated test accounts; refusing to report false success"
            exit 1
          fi
          curl -fsSL --retry 3 --max-time 30 -o /dev/null "$E2E_BASE_URL/login"
      - name: Install isolated Playwright runner
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.58.2 && npx playwright install --with-deps chromium
      - name: Verify all five role logins and navigate their portals
        run: node scripts/e2e-all-portals.mjs
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portal-e2e-failures
          path: e2e-*.png
          if-no-files-found: ignore
