name: Deploy Cloudflare

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: uptilldawn-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      # Public production Supabase config. Keep this pinned so production cannot
      # accidentally deploy against the preview project.
      NEXT_PUBLIC_SUPABASE_URL: https://eakoavcieossazqzplke.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_DYhOH4m7Kz4P9ZzdQ6aQZQ_DEoZJHp9
      NEXT_PUBLIC_APP_URL: https://crew.uptilldawn.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - name: Refuse non-main deployment
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "Production deployment is only allowed from main."
          exit 1

      - name: Verify automatic deploy source
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          test "${{ github.event.workflow_run.head_branch }}" = "main"
          test "${{ github.event.workflow_run.conclusion }}" = "success"
          echo "Deploying tested main commit ${{ github.event.workflow_run.head_sha }}."

      - name: Validate required production secrets
        shell: bash
        env:
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SECURITY_FROM_EMAIL: ${{ secrets.SECURITY_FROM_EMAIL }}
          SECURITY_ALERT_EMAIL: ${{ secrets.SECURITY_ALERT_EMAIL }}
          SELF_HEALING_GITHUB_TOKEN: ${{ secrets.SELF_HEALING_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY GEOAPIFY_API_KEY RESEND_API_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required production secret: $name"
              exit 1
            fi
          done
          case "$NEXT_PUBLIC_APP_URL" in
            https://*) ;;
            *) echo "::error::NEXT_PUBLIC_APP_URL must be an HTTPS production origin."; exit 1 ;;
          esac

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build Cloudflare Worker
        run: npm run build:cloudflare

      - name: Deployment dry-run
        run: npx wrangler deploy --dry-run

      - name: Public alias dry-run
        run: npx wrangler deploy --dry-run --config wrangler.alias.jsonc

      - name: Verify login-alert email transport
        shell: bash
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SECURITY_FROM_EMAIL: ${{ secrets.SECURITY_FROM_EMAIL }}
          SECURITY_ALERT_EMAIL: ${{ secrets.SECURITY_ALERT_EMAIL }}
        run: |
          set -euo pipefail
          FROM="${SECURITY_FROM_EMAIL:-UpTillDawn Security <onboarding@resend.dev>}"
          TO="${SECURITY_ALERT_EMAIL:-steegmans.kyani@icloud.com}"
          payload=$(FROM="$FROM" TO="$TO" node -e 'console.log(JSON.stringify({from:process.env.FROM,to:[process.env.TO],subject:"[UpTillDawn] Security mail transport test",text:"Automatische productietest van de login-alert e-mailtransportlaag."}))')
          http_code=$(curl -sS -o resend-response.json -w "%{http_code}" https://api.resend.com/emails             -H "Authorization: Bearer $RESEND_API_KEY"             -H "Content-Type: application/json"             -d "$payload")
          cat resend-response.json
          echo
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Resend transport test failed with HTTP $http_code"
            exit 1
          fi

      - name: Configure Geoapify runtime secret
        env:
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
        run: printf '%s' "$GEOAPIFY_API_KEY" | npx wrangler secret put GEOAPIFY_API_KEY

      - name: Configure login-alert email secret
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY

      - name: Configure admin-alert recipient
        run: printf '%s' 'steegmans.kyani@icloud.com' | npx wrangler secret put SECURITY_ALERT_EMAIL

      - name: Configure optional login-alert routing
        env:
          SECURITY_FROM_EMAIL: ${{ secrets.SECURITY_FROM_EMAIL }}
          SECURITY_ALERT_EMAIL: ${{ secrets.SECURITY_ALERT_EMAIL }}
        run: |
          if [ -n "${SECURITY_FROM_EMAIL:-}" ]; then
            printf '%s' "$SECURITY_FROM_EMAIL" | npx wrangler secret put SECURITY_FROM_EMAIL
          fi
          if [ -n "${SECURITY_ALERT_EMAIL:-}" ]; then
            printf '%s' "$SECURITY_ALERT_EMAIL" | npx wrangler secret put SECURITY_ALERT_EMAIL
          fi

      - name: Configure self-healing GitHub credential when available
        env:
          SELF_HEALING_GITHUB_TOKEN: ${{ secrets.SELF_HEALING_GITHUB_TOKEN }}
        run: |
          if [ -n "${SELF_HEALING_GITHUB_TOKEN:-}" ]; then
            printf '%s' "$SELF_HEALING_GITHUB_TOKEN" | npx wrangler secret put SELF_HEALING_GITHUB_TOKEN
          else
            echo "SELF_HEALING_GITHUB_TOKEN is not configured; normal deployment continues."
          fi

      - name: Configure optional live translation provider
        shell: bash
        env:
          TRANSLATION_API_URL: ${{ secrets.TRANSLATION_API_URL }}
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
        run: |
          if [ -n "${TRANSLATION_API_URL:-}" ]; then
            printf '%s' "$TRANSLATION_API_URL" | npx wrangler secret put TRANSLATION_API_URL
          fi
          if [ -n "${TRANSLATION_API_KEY:-}" ]; then
            printf '%s' "$TRANSLATION_API_KEY" | npx wrangler secret put TRANSLATION_API_KEY
          fi

      - name: Deploy production Worker
        run: npm run deploy:cloudflare

      - name: Deploy public Worker alias
        run: npx wrangler deploy --config wrangler.alias.jsonc
