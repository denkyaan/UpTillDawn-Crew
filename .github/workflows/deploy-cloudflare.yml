name: Deploy Cloudflare

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: uptilldawn-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04-arm
    environment: production
    permissions:
      contents: read
    env:
      # Public production Supabase config. Keep this pinned so production cannot
      # accidentally deploy against the preview project.
      NEXT_PUBLIC_SUPABASE_URL: https://eakoavcieossazqzplke.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_DYhOH4m7Kz4P9ZzdQ6aQZQ_DEoZJHp9
      NEXT_PUBLIC_APP_URL: https://crew.uptilldawn.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify automatic deploy source
        shell: bash
        run: |
          test "${{ github.event.workflow_run.head_branch }}" = "main"
          test "${{ github.event.workflow_run.conclusion }}" = "success"
          echo "Deploying tested main commit ${{ github.event.workflow_run.head_sha }}."

      - name: Validate required production secrets
        shell: bash
        env:
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SECURITY_FROM_EMAIL: ${{ secrets.SECURITY_FROM_EMAIL }}
          SECURITY_ALERT_EMAIL: ${{ secrets.SECURITY_ALERT_EMAIL }}
          SELF_HEALING_GITHUB_TOKEN: ${{ secrets.SELF_HEALING_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY GEOAPIFY_API_KEY RESEND_API_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required production secret: $name"
              exit 1
            fi
          done
          case "$NEXT_PUBLIC_APP_URL" in
            https://*) ;;
            *) echo "::error::NEXT_PUBLIC_APP_URL must be an HTTPS production origin."; exit 1 ;;
          esac

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Development dependency audit
        # Keep the full advisory visible without blocking production on an
        # unpatched dev-only lint dependency. Production dependencies fail hard.
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Production Supabase RPC contract
        shell: bash
        run: |
          set -euo pipefail

          check_rpc() {
            local rpc="$1"
            local payload="$2"
            local body
            body=$(mktemp)
            local code
            code=$(curl -sS -o "$body" -w "%{http_code}" -X POST \
              "${NEXT_PUBLIC_SUPABASE_URL}/rest/v1/rpc/${rpc}" \
              -H "apikey: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
              -H "Content-Type: application/json" \
              -d "$payload")

            echo "${rpc}: HTTP ${code}"
            cat "$body"
            echo

            if [ "$code" = "404" ] || grep -q 'PGRST202' "$body" || grep -qi 'could not find the function' "$body"; then
              echo "::error::Production Supabase RPC contract missing: ${rpc}"
              exit 1
            fi
          }

          check_rpc upt_current_profile '{}'
          check_rpc upt_current_is_owner '{}'
          check_rpc upt_current_effective_role '{}'
          check_rpc upt_set_admin_role_mode '{"p_role":"admin"}'

      - name: Build Cloudflare Worker
        run: npm run build:cloudflare

      - name: Deployment dry-run
        run: npx wrangler deploy --dry-run

      - name: Public alias dry-run
        run: npx wrangler deploy --dry-run --config wrangler.alias.jsonc

      - name: Verify login-alert email transport
        shell: bash
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SECURITY_FROM_EMAIL: ${{ secrets.SECURITY_FROM_EMAIL }}
          SECURITY_ALERT_EMAIL: ${{ secrets.SECURITY_ALERT_EMAIL }}
        run: |
          set -euo pipefail
          FROM="${SECURITY_FROM_EMAIL:-UpTillDawn Security <onboarding@resend.dev>}"
          TO="${SECURITY_ALERT_EMAIL:-steegmans.kyani@icloud.com}"
          payload=$(FROM="$FROM" TO="$TO" node -e 'console.log(JSON.stringify({from:process.env.FROM,to:[process.env.TO],subject:"[UpTillDawn] Security mail transport test",text:"Automatische productietest van de login-alert e-mailtransportlaag."}))')
          http_code=$(curl -sS -o resend-response.json -w "%{http_code}" https://api.resend.com/emails             -H "Authorization: Bearer $RESEND_API_KEY"             -H "Content-Type: application/json"             -d "$payload")
          cat resend-response.json
          echo
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Resend transport test failed with HTTP $http_code"
            exit 1
          fi

      - name: Configure Geoapify runtime secret
        env:
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
        run: printf '%s' "$GEOAPIFY_API_KEY" | npx wrangler secret put GEOAPIFY_API_KEY

      - name: Configure login-alert email secret
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY

      - name: Configure admin-alert recipient
        run: printf '%s' 'steegmans.kyani@icloud.com' | npx wrangler secret put SECURITY_ALERT_EMAIL

      - name: Configure optional login-alert routing
        env:
          SECURITY_FROM_EMAIL: ${{ secrets.SECURITY_FROM_EMAIL }}
          SECURITY_ALERT_EMAIL: ${{ secrets.SECURITY_ALERT_EMAIL }}
        run: |
          if [ -n "${SECURITY_FROM_EMAIL:-}" ]; then
            printf '%s' "$SECURITY_FROM_EMAIL" | npx wrangler secret put SECURITY_FROM_EMAIL
          fi
          if [ -n "${SECURITY_ALERT_EMAIL:-}" ]; then
            printf '%s' "$SECURITY_ALERT_EMAIL" | npx wrangler secret put SECURITY_ALERT_EMAIL
          fi

      - name: Configure self-healing GitHub credential when available
        env:
          SELF_HEALING_GITHUB_TOKEN: ${{ secrets.SELF_HEALING_GITHUB_TOKEN }}
        run: |
          if [ -n "${SELF_HEALING_GITHUB_TOKEN:-}" ]; then
            printf '%s' "$SELF_HEALING_GITHUB_TOKEN" | npx wrangler secret put SELF_HEALING_GITHUB_TOKEN
          else
            echo "SELF_HEALING_GITHUB_TOKEN is not configured; normal deployment continues."
          fi

      - name: Configure optional live translation provider
        shell: bash
        env:
          TRANSLATION_API_URL: ${{ secrets.TRANSLATION_API_URL }}
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
        run: |
          if [ -n "${TRANSLATION_API_URL:-}" ]; then
            printf '%s' "$TRANSLATION_API_URL" | npx wrangler secret put TRANSLATION_API_URL
          fi
          if [ -n "${TRANSLATION_API_KEY:-}" ]; then
            printf '%s' "$TRANSLATION_API_KEY" | npx wrangler secret put TRANSLATION_API_KEY
          fi

      - name: Deploy production Worker
        run: npm run deploy:cloudflare

      - name: Deploy public Worker alias
        run: npx wrangler deploy --config wrangler.alias.jsonc

      - name: Capture upstream and alias Worker exceptions
        shell: bash
        run: |
          # The public endpoint is the 'crew' alias, which forwards to
          # 'uptilldawn-crew'. Either Worker may throw the 1101 exception.
          for worker in crew uptilldawn-crew; do
            (timeout 120s npx wrangler tail "$worker" --format json > "/tmp/upt-tail-${worker}.jsonl" 2> "/tmp/upt-tail-${worker}.err" || true) &
          done
          sleep 8

      - name: Production public-surface smoke
        shell: bash
        run: |
          set -euo pipefail
          html_paths=("/" "/login/admin" "/login/responsible" "/login/staff")
          for path in "${html_paths[@]}"; do
            safe_name=$(printf '%s' "$path" | tr '/.' '__')
            body="/tmp/upt-smoke-${safe_name}.body"
            code=$(curl -L -sS --retry 5 --retry-delay 2 --retry-all-errors -o "$body" -w "%{http_code}" "${NEXT_PUBLIC_APP_URL}${path}")
            echo "${path}: HTTP ${code}"
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              echo "::error::Production smoke failed for ${path} with HTTP ${code}"
              exit 1
            fi
            if [ ! -s "$body" ] || ! grep -qi 'UP TILL DAWN' "$body"; then
              echo "::error::Production HTML smoke did not contain the expected app marker for ${path}"
              exit 1
            fi
          done

          manifest_body=/tmp/upt-smoke-manifest.body
          manifest_code=$(curl -L -sS --retry 5 --retry-delay 2 --retry-all-errors -o "$manifest_body" -w "%{http_code}" "${NEXT_PUBLIC_APP_URL}/manifest.webmanifest")
          echo "/manifest.webmanifest: HTTP ${manifest_code}"
          if [ "$manifest_code" -lt 200 ] || [ "$manifest_code" -ge 400 ] || ! grep -q '"name"' "$manifest_body" || ! grep -q '"start_url"' "$manifest_body"; then
            echo "::error::Production manifest smoke failed"
            exit 1
          fi

          sw_body=/tmp/upt-smoke-sw.body
          sw_code=$(curl -L -sS --retry 5 --retry-delay 2 --retry-all-errors -o "$sw_body" -w "%{http_code}" "${NEXT_PUBLIC_APP_URL}/sw.js")
          echo "/sw.js: HTTP ${sw_code}"
          if [ "$sw_code" -lt 200 ] || [ "$sw_code" -ge 400 ] || ! grep -q "self.addEventListener" "$sw_body"; then
            echo "::error::Production service-worker smoke failed"
            exit 1
          fi

      - name: Report Worker exceptions and tail diagnostics
        if: always()
        shell: bash
        run: |
          for worker in crew uptilldawn-crew; do
            echo "=== ${worker} ==="
            WORKER="$worker" node <<'NODE'
          const fs = require('fs');
          const worker = process.env.WORKER;
          const file = `/tmp/upt-tail-${worker}.jsonl`;
          if (fs.existsSync(file)) {
            const lines = fs.readFileSync(file, 'utf8').split(/\r?\n/);
            console.log('Tail events captured:', lines.filter(Boolean).length);
            for (const line of lines) {
              try {
                const event = JSON.parse(line);
                for (const error of event.exceptions || []) {
                  console.log('Worker exception:', JSON.stringify({
                    name: error.name, message: error.message, stack: error.stack
                  }));
                }
                if (event.outcome && event.outcome !== 'ok') {
                  console.log('Worker outcome:', event.outcome);
                }
              } catch {}
            }
          } else console.log('No tail output file');
          NODE
            if [ -f "/tmp/upt-tail-${worker}.err" ]; then
              sed -E 's/(token|key|password)=[^ ]+/\1=[REDACTED]/Ig' "/tmp/upt-tail-${worker}.err" | tail -12
            fi
          done
