name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Keep this workflow manually dispatchable when a push webhook is delayed.

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Placeholder public values are sufficient for compile-time validation.
      # Real production values are configured separately in Cloudflare.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: PWA cross-device and offline contract
        run: node --test tests/pwa-cross-device-offline-regression.test.mjs

      - name: Build Next.js
        run: npm run build:next

      - name: Build Cloudflare Worker
        run: npm run build:cloudflare

      - name: Wrangler deployment dry-run
        run: npx wrangler deploy --dry-run

  browser-bots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      BOT_TEST_BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install application
        run: npm ci
      - name: Install isolated browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build application
        run: npm run build:next
      - name: Start application
        run: |
          npm start > /tmp/uptilldawn-bot-app.log 2>&1 &
          echo $! > /tmp/uptilldawn-bot-app.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/login/staff >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/uptilldawn-bot-app.log
          exit 1
      - name: Run 15 concurrent browser bots
        run: node scripts/15-bot-browser-test.mjs
      - name: Stop application
        if: always()
        run: kill $(cat /tmp/uptilldawn-bot-app.pid) 2>/dev/null || true

  fresh-install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Initialize isolated Supabase config
        run: |
          if [ ! -f supabase/config.toml ]; then
            npx --yes supabase@2.117.0 init
          fi

      - name: Start isolated Supabase stack
        run: npx --yes supabase@2.117.0 start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,realtime

      - name: Replay every migration from zero
        run: npx --yes supabase@2.117.0 db reset --local --no-seed

      - name: Run SQL regression suites
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          for file in tests/sql/*.sql; do
            echo "::group::$file"
            psql "$PGURL" -v ON_ERROR_STOP=1 -f "$file"
            echo "::endgroup::"
          done

      - name: Verify generated database types
        run: |
          npx --yes supabase@2.117.0 gen types typescript --local --schema public > /tmp/crew-database.ts
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const normalize = (source) => source
            .replace(
              /  \/\/ Allows to automatically instantiate createClient with right options\n  \/\/ instead of createClient<Database, \{ PostgrestVersion: 'XX' \}>\(URL, KEY\)\n  __InternalSupabase: \{\n    PostgrestVersion: "[^"]+"\n  \}\n/,
              '',
            )
            .trimEnd() + '\n'
          writeFileSync('/tmp/expected-crew-database.ts', normalize(readFileSync('types/crew-database.ts', 'utf8')))
          writeFileSync('/tmp/actual-crew-database.ts', normalize(readFileSync('/tmp/crew-database.ts', 'utf8')))
          NODE
          diff -u /tmp/expected-crew-database.ts /tmp/actual-crew-database.ts

      - name: Record replay proof
        run: |
          migration_count=$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')
          sql_suite_count=$(find tests/sql -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')
          {
            echo "## Fresh-install database proof"
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- Migrations replayed: ${migration_count}"
            echo "- SQL suites: ${sql_suite_count}"
            echo "- Generated types: exact match"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop isolated Supabase stack
        if: always()
        run: npx --yes supabase@2.117.0 stop --no-backup
