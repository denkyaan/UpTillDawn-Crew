name: CI main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_production:
        description: 'Explicit owner-authorized production release: dispatch full CI production after successful fast CI main'
        type: boolean
        required: true
        default: false

concurrency:
  group: fast-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Enforce exactly five approved workflow files
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            '.github/workflows/ci.yml' \
            '.github/workflows/cleanup-actions-history.yml' \
            '.github/workflows/deploy-cloudflare.yml' \
            '.github/workflows/deploy-main.yml' \
            '.github/workflows/fast-change-validation.yml' | sort)"
          actual="$(find .github/workflows -maxdepth 1 -type f | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Only the five approved GitHub Actions workflows may exist."
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          echo "Approved workflow inventory: exactly five files"
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Parallel lint, typecheck and unit tests
        shell: bash
        run: |
          set -uo pipefail
          npm run lint > /tmp/fast-lint.log 2>&1 & lint_pid=$!
          npm run typecheck > /tmp/fast-typecheck.log 2>&1 & types_pid=$!
          npm test > /tmp/fast-tests.log 2>&1 & tests_pid=$!
          failed=0
          for entry in "lint:$lint_pid" "typecheck:$types_pid" "tests:$tests_pid"; do
            label="${entry%%:*}"
            pid="${entry#*:}"
            if wait "$pid"; then
              echo "PASS: $label"
            else
              echo "::error::$label failed"
              failed=1
            fi
            cat "/tmp/fast-$label.log"
          done
          exit "$failed"
      - name: Read isolated Main Worker runtime outcomes for diagnostic PRs
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'diagnostic/main-runtime') && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/main-worker-outcomes.mjs
      # Candidate-only build gate. Never slows ordinary Main CI/deploy; the
      # current production app remains Next/OpenNext until the full parity gate.
      - name: Validate isolated Vite/Hono migration build
        if: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'migration/') || startsWith(github.head_ref, 'diagnostic/main-runtime')) }}
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix modern install --no-audit --no-fund --prefer-offline
          npm --prefix modern run check
          npm --prefix modern run build
          npm --prefix modern run budget
          npm --prefix modern run worker:check
          npm --prefix modern run api:test
          npm --prefix modern run inventory
          npm --prefix modern run rpc:contract
          npm --prefix modern audit --omit=dev --audit-level=high
      # Isolated migration PR only. Main fast CI remains unchanged.
      - name: Candidate anonymous browser acceptance (4 languages x 2 device profiles)
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'migration/') }}
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-public-key
          VITE_MIGRATION_ALLOW_WRITES: "false"
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix modern run build
          # Headless Chromium only; avoid apt package downloads on each CI run.
          npx playwright install chromium --only-shell
          npm --prefix modern run browser:test
      - name: Candidate authenticated seven-role browser acceptance (isolated Main QA only)
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'migration/') && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          E2E_MAIN_QA_PASSWORD: ${{ secrets.MAIN_QA_BOT_PASSWORD }}
          E2E_MAIN_QA_BASE_URL: https://npbjrtiolqperdgljnhi.supabase.co/
          E2E_MAIN_QA_PUBLISHABLE_KEY: sb_publishable_zStTw3n8wZ271PehDRDvGg_rs0JOy84
          VITE_SUPABASE_URL: https://npbjrtiolqperdgljnhi.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_zStTw3n8wZ271PehDRDvGg_rs0JOy84
          VITE_MIGRATION_ALLOW_WRITES: "false"
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${E2E_MAIN_QA_PASSWORD:-}" ]; then
            echo "::warning::QA-only password secret not configured. Authenticated acceptance NOT executed."
            echo "Authenticated candidate acceptance: NOT EXECUTED (secret missing)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm --prefix modern run build
          npm --prefix modern run browser:qa
          echo "Authenticated candidate acceptance: seven distinct bot logins / 56 localized device scenarios PASSED" >> "$GITHUB_STEP_SUMMARY"
      - name: Candidate 30 independent signed QA sessions and one bounded read-only peak
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'migration/') && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          E2E_MAIN_QA_PASSWORD: ${{ secrets.MAIN_QA_BOT_PASSWORD }}
          E2E_MAIN_QA_BASE_URL: https://npbjrtiolqperdgljnhi.supabase.co/
          E2E_MAIN_QA_PUBLISHABLE_KEY: sb_publishable_zStTw3n8wZ271PehDRDvGg_rs0JOy84
          VITE_MIGRATION_ALLOW_WRITES: "false"
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${E2E_MAIN_QA_PASSWORD:-}" ]; then
            echo "::warning::30-session QA acceptance not executed: QA password secret unavailable."
            echo "30-session acceptance NOT EXECUTED" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm --prefix modern run sessions:qa
          echo "30 distinct signed QA sessions + 30 concurrent authenticated Supabase reads: PASS" >> "$GITHUB_STEP_SUMMARY"
      - name: Inventory every Main page and API route
        run: node scripts/main-adversarial-surface.mjs --inventory-only
      - name: Audit requested product functionality against committed code and tests
        run: node scripts/main-requirements-audit.mjs
      - name: Final six-role acceptance inventory (static evidence only)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/final-main-acceptance-inventory.mjs
          {
            echo '## Main final acceptance (static inventory)'
            echo 'Six role source surfaces and four-locales browser harness: present'
            echo 'Authenticated end-to-end journeys: not executed in this fast CI'
            echo 'Live provider delivery, disaster recovery and mobile device acceptance: unverified'
            echo 'Full release approval remains blocked pending separate evidence.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high
  release-production:
    needs: fast
    # Only a manual, explicit release input may dispatch full CI production.
    # Ordinary Main pushes, pull requests and commit markers NEVER trigger production.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_production == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch production CI after successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Require the exact validated current main commit; prevent unintended release after branch drift.
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "${current_sha}" != "${GITHUB_SHA}" ]; then
            echo "::error::Main advanced to ${current_sha}; explicit release SHA was ${GITHUB_SHA}"
            exit 1
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" -f ref=main
          echo "Explicit production CI requested for exact main ${current_sha}"

