name: CI main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_production:
        description: 'Explicit owner-authorized production release: dispatch full CI production after successful fast CI main'
        type: boolean
        required: true
        default: false

concurrency:
  group: fast-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Enforce exactly five approved workflow files
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            '.github/workflows/ci.yml' \
            '.github/workflows/cleanup-actions-history.yml' \
            '.github/workflows/deploy-cloudflare.yml' \
            '.github/workflows/deploy-main.yml' \
            '.github/workflows/fast-change-validation.yml' | sort)"
          actual="$(find .github/workflows -maxdepth 1 -type f | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Only the five approved GitHub Actions workflows may exist."
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          echo "Approved workflow inventory: exactly five files"
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Parallel lint, typecheck and unit tests
        shell: bash
        run: |
          set -uo pipefail
          npm run lint > /tmp/fast-lint.log 2>&1 & lint_pid=$!
          npm run typecheck > /tmp/fast-typecheck.log 2>&1 & types_pid=$!
          npm test > /tmp/fast-tests.log 2>&1 & tests_pid=$!
          failed=0
          for entry in "lint:$lint_pid" "typecheck:$types_pid" "tests:$tests_pid"; do
            label="${entry%%:*}"
            pid="${entry#*:}"
            if wait "$pid"; then
              echo "PASS: $label"
            else
              echo "::error::$label failed"
              failed=1
            fi
            cat "/tmp/fast-$label.log"
          done
          exit "$failed"
      - name: Inventory every Main page and API route
        run: node scripts/main-adversarial-surface.mjs --inventory-only
      - name: Audit requested product functionality against committed code and tests
        run: node scripts/main-requirements-audit.mjs
      - name: Final six-role acceptance inventory (static evidence only)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/final-main-acceptance-inventory.mjs
          {
            echo '## Main final acceptance (static inventory)'
            echo 'Six role source surfaces and four-locales browser harness: present'
            echo 'Authenticated end-to-end journeys: not executed in this fast CI'
            echo 'Live provider delivery, disaster recovery and mobile device acceptance: unverified'
            echo 'Full release approval remains blocked pending separate evidence.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high
      # Branch-scoped vinext candidate verification. This is part of CI main,
      # not a sixth workflow; it cannot deploy to Main or Production.
      - name: Compile vinext candidate against isolated Main QA configuration (no deployment)
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/vinext-auth-parity-free-20261115' }}
        timeout-minutes: 8
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://npbjrtiolqperdgljnhi.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_zStTw3n8wZ271PehDRDvGg_rs0JOy84
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:8788
        shell: bash
        run: |
          set -euo pipefail
          # vinext init changes only this ephemeral CI checkout, not git files.
          npx --yes vinext@1.4.5 init --platform=cloudflare --name=uptilldawn-main --cdn-cache=none --data-cache=none --image-optimization=none --no-prerender --ignore-wrangler-config
          # Migrate with patched versions, not the vulnerable defaults
          # (undici <=7.30.0 and Vite 8.3.0..8.3.2). Keep this in CI only.
          npm pkg set overrides.undici=7.30.2
          npm install --save-dev --save-exact vite@8.3.8 --no-audit --no-fund
          node scripts/prepare-local-ocr.mjs
          npm run build:vinext

      - name: Audit vinext candidate runtime dependencies after temporary initialization
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/vinext-auth-parity-free-20261115' }}
        timeout-minutes: 3
        run: npm audit --omit=dev --audit-level=high

      - name: Exercise all seven QA role logins against vinext local preview (no deployment)
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/vinext-auth-parity-free-20261115' }}
        timeout-minutes: 7
        env:
          VINEXT_AUTH_POC_BASE_URL: http://127.0.0.1:8788
          MAIN_QA_BOT_PASSWORD: ${{ secrets.MAIN_QA_BOT_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: https://npbjrtiolqperdgljnhi.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_zStTw3n8wZ271PehDRDvGg_rs0JOy84
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:8788
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MAIN_QA_BOT_PASSWORD:-}" ]; then
            echo "::error::Missing isolated Main QA password; refusing to treat skipped login checks as a pass"
            exit 1
          fi
          npx playwright install --with-deps chromium
          npm run start:vinext -- --host 127.0.0.1 --port 8788 >/tmp/vinext-auth-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              echo "::error::vinext preview process exited prematurely"
              tail -40 /tmp/vinext-auth-preview.log
              exit 1
            fi
            code="$(curl -sS --max-time 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:8788/login/staff || true)"
            if [ "$code" = '200' ]; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "::error::vinext preview did not become ready"
            tail -50 /tmp/vinext-auth-preview.log
            exit 1
          fi
          node scripts/vinext-main-auth-smoke.mjs
          echo 'vinext local seven-role authorization and browser smoke passed; Cloudflare CPU still unverified'

      - name: Report intentionally disabled Main Preview URL access
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/vinext-auth-parity-free-20261115' && vars.UPT_MAIN_PREVIEWS_ALLOWED != 'true' }}
        shell: bash
        run: |
          echo "::notice::Live Cloudflare Free Preview tests were NOT run: Main Worker preview URLs are intentionally disabled. Set up an explicitly authorized Preview host and repository variable UPT_MAIN_PREVIEWS_ALLOWED=true to opt in."
          echo "VINEXT_CLOUDFLARE_FREE_RUNTIME=UNVERIFIED" >> "$GITHUB_STEP_SUMMARY"

      # Upload a non-promoted version Preview of the existing Main Worker.
      # This is NOT a new staging environment or sixth workflow; the active
      # workers.dev Main route and all production bindings remain untouched.
      - name: Deploy non-promoted vinext Worker Free preview of Main
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/vinext-auth-parity-free-20261115' && vars.UPT_MAIN_PREVIEWS_ALLOWED == 'true' }}
        id: vinext-preview
        timeout-minutes: 7
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: https://npbjrtiolqperdgljnhi.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_zStTw3n8wZ271PehDRDvGg_rs0JOy84
          NEXT_PUBLIC_APP_URL: https://uptilldawn-main.uptilldawn.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          # The local QA build has already run with the isolated Main Supabase.
          # A Preview upload must never promote the version to live traffic.
          test -f cloudflare.config.ts
          if ! grep -q "uptilldawn-main" cloudflare.config.ts; then
            echo "::error::Generated Worker must be uptilldawn-main, refusing Preview deployment"
            exit 1
          fi
          set +e
          npx @vinext/cloudflare previews deploy --preview-name qa-free-340 > /tmp/vinext-free-preview.log 2>&1
          deploy_code=$?
          set -e
          if [ "$deploy_code" -ne 0 ]; then
            echo "::error::Non-promoted vinext Preview upload failed; active Main unchanged"
            tail -45 /tmp/vinext-free-preview.log | sed -E 's/(Bearer |token=)[^[:space:]]+/\\1[REDACTED]/g'
            exit "$deploy_code"
          fi
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+[.]workers[.]dev' /tmp/vinext-free-preview.log | grep -F 'uptilldawn-main' | tail -n1 || true)"
          # A failed regex match must trigger this explicit diagnostic, not
          # terminate earlier through Bash pipefail.
          if [ -z "$url" ]; then
            echo "::error::Preview URL not reported by Cloudflare"
            tail -30 /tmp/vinext-free-preview.log
            exit 1
          fi
          hostname="$(node -e 'process.stdout.write(new URL(process.argv[1]).hostname)' "$url")"
          case "$hostname" in
            *-uptilldawn-main.uptilldawn.workers.dev) ;;
            *) echo "::error::Preview host is not an isolated version of the Main Worker"; exit 1 ;;
          esac
          echo "preview_url=$url" >> "$GITHUB_OUTPUT"
          echo "Non-promoted Cloudflare Free Preview deployed; Main traffic untouched"

      - name: Check live Cloudflare Free preview role entrypoints and protected denial
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/vinext-auth-parity-free-20261115' && vars.UPT_MAIN_PREVIEWS_ALLOWED == 'true' }}
        timeout-minutes: 5
        env:
          VINEXT_FREE_PREVIEW_URL: ${{ steps.vinext-preview.outputs.preview_url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VINEXT_FREE_PREVIEW_URL:-}"
          for portal in staff responsible promotion administration admin; do
            status="$(curl --max-time 20 --retry 2 --retry-all-errors -L -sS -o /dev/null -w '%{http_code}' "${VINEXT_FREE_PREVIEW_URL}/login/$portal")"
            if [ "$status" != 200 ]; then
              echo "::error::Cloudflare Free Preview /login/$portal responded $status"
              exit 1
            fi
            echo "PASS Cloudflare Free Preview /login/$portal HTTP 200"
          done
          echo 'Cloudflare Free Preview GET shells passed; protected seven-role session smoke still required'

      - name: Validate seven real role sessions on non-promoted Cloudflare Workers Free Preview
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/vinext-auth-parity-free-20261115' && vars.UPT_MAIN_PREVIEWS_ALLOWED == 'true' }}
        timeout-minutes: 10
        env:
          VINEXT_FREE_PREVIEW_URL: ${{ steps.vinext-preview.outputs.preview_url }}
          MAIN_QA_BOT_PASSWORD: ${{ secrets.MAIN_QA_BOT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/vinext-main-worker-preview-smoke.mjs



  release-production:
    needs: fast
    # Only a manual, explicit release input may dispatch full CI production.
    # Ordinary Main pushes, pull requests and commit markers NEVER trigger production.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_production == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch production CI after successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Require the exact validated current main commit; prevent unintended release after branch drift.
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "${current_sha}" != "${GITHUB_SHA}" ]; then
            echo "::error::Main advanced to ${current_sha}; explicit release SHA was ${GITHUB_SHA}"
            exit 1
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" -f ref=main
          echo "Explicit production CI requested for exact main ${current_sha}"

