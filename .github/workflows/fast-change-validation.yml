name: CI main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_production:
        description: 'Start CI production after successful CI main'
        type: boolean
        required: true
        default: false
      run_six_role_acceptance:
        description: 'Run read-only six-role QA browser acceptance on main (requires dedicated QA secrets)'
        type: boolean
        required: false
        default: false

concurrency:
  group: fast-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Enforce exactly five approved workflow files
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            '.github/workflows/ci.yml' \
            '.github/workflows/cleanup-actions-history.yml' \
            '.github/workflows/deploy-cloudflare.yml' \
            '.github/workflows/deploy-main.yml' \
            '.github/workflows/fast-change-validation.yml' | sort)"
          actual="$(find .github/workflows -maxdepth 1 -type f | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Only the five approved GitHub Actions workflows may exist."
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          echo "Approved workflow inventory: exactly five files"
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Parallel lint, typecheck and unit tests
        shell: bash
        run: |
          set -uo pipefail
          npm run lint > /tmp/fast-lint.log 2>&1 & lint_pid=$!
          npm run typecheck > /tmp/fast-typecheck.log 2>&1 & types_pid=$!
          npm test > /tmp/fast-tests.log 2>&1 & tests_pid=$!
          failed=0
          for entry in "lint:$lint_pid" "typecheck:$types_pid" "tests:$tests_pid"; do
            label="${entry%%:*}"
            pid="${entry#*:}"
            if wait "$pid"; then
              echo "PASS: $label"
            else
              echo "::error::$label failed"
              failed=1
            fi
            cat "/tmp/fast-$label.log"
          done
          exit "$failed"
      - name: Inventory every Main page and API route
        run: node scripts/main-adversarial-surface.mjs --inventory-only
      - name: Final six-role acceptance inventory (static evidence only)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/final-main-acceptance-inventory.mjs
          {
            echo '## Main final acceptance (static inventory)'
            echo 'Six role source surfaces and four-locales browser harness: present'
            echo 'Authenticated end-to-end journeys: not executed in this fast CI'
            echo 'Live provider delivery, disaster recovery and mobile device acceptance: unverified'
            echo 'Full release approval remains blocked pending separate evidence.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high

      - name: One-time read-only live Cloudflare God Mode binding verification
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'qa/cloudflare-main-observability-binding-20261112' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID
          const token=process.env.CLOUDFLARE_API_TOKEN
          if(!account||!token)throw new Error('GitHub Cloudflare management credentials missing; binding status unverified')
          const base='https://api.cloudflare.com/client/v4/accounts/'+account
          const worker='uptilldawn-main'
          const res=await fetch(base+'/workers/scripts/'+worker+'/secrets',{
            headers:{Authorization:'Bearer '+token},cache:'no-store',signal:AbortSignal.timeout(20000),
          })
          if(!res.ok)throw new Error('Unable to verify main Worker binding metadata: HTTP '+res.status)
          const data=await res.json()
          if(data.success!==true||!Array.isArray(data.result))throw new Error('Cloudflare binding metadata is invalid')
          const binding=data.result.find(s=>s?.name==='CLOUDFLARE_OBSERVABILITY_CONFIG')
          const exists=Boolean(binding)
          const type=typeof binding?.type==='string'?binding.type:'unknown'
          console.log('God Mode main Worker observability binding:',exists?'PRESENT':'MISSING')
          console.log('God Mode binding type:',type)
          if(!exists)throw new Error('CLOUDFLARE_OBSERVABILITY_CONFIG is missing from uptilldawn-main')
          if(type==='plain_text'||type==='plain')throw new Error('Observability config must be encrypted as a Worker Secret, not plain text')
          const hostname='https://uptilldawn-main.uptilldawn.workers.dev'
          const publicRoute=await fetch(hostname+'/api/god/cloudflare-logs?environment=main&limit=1',{
            redirect:'manual',cache:'no-store',signal:AbortSignal.timeout(20000),
          })
          console.log('Live unauthenticated God Mode Cloudflare API status:',publicRoute.status)
          if(publicRoute.status!==401)throw new Error('God Mode Cloudflare API must fail closed for unauthenticated requests')
          const now=Date.now()
          // Additional provider-query health check with the existing deploy token.
          // It may lack Observability scope; a 401/403 here does NOT invalidate
          // the independent runtime-scoped token stored inside the Worker.
          const query=await fetch(base+'/workers/observability/telemetry/query',{
            method:'POST',
            headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
            body:JSON.stringify({
              queryId:'main-god-log-binding-qa',dry:true,view:'events',limit:1,
              timeframe:{from:now-15*60000,to:now},
              parameters:{datasets:['cloudflare-workers'],filterCombination:'and',
                filters:[{id:'1',key:'$metadata.service',type:'string',operation:'eq',kind:'filter',value:worker}]},
            }),
            cache:'no-store',signal:AbortSignal.timeout(20000),
          }).catch(()=>null)
          if(query){
            console.log('Independent Cloudflare Observability query via GitHub deployment token: HTTP',query.status)
            if(query.ok){
              const payload=await query.json().catch(()=>null)
              console.log('Cloudflare query response schema verified:',payload?.success===true&&Array.isArray(payload?.result?.events?.events))
            }
          }else console.log('Independent Cloudflare Observability query unavailable (runtime token remains private)')
          console.log('PASS: Main Worker binding present and live Maker-only log route denies anonymous access')
          NODE

  full-validation:
    name: Full validation (explicit commit opt-in)
    needs: fast
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[full-ci]') }}
    uses: ./.github/workflows/ci.yml

  release-production:
    needs: fast
    # Explicit owner-authorized release marker is permitted on a reviewed main merge;
    # ordinary main pushes and PRs NEVER start production CI.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_production == true && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-production]')) }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch production CI after successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Require the exact validated current main commit; prevent unintended release after branch drift.
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "${current_sha}" != "${GITHUB_SHA}" ]; then
            echo "::error::Main advanced to ${current_sha}; explicit release SHA was ${GITHUB_SHA}"
            exit 1
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" -f ref=main
          echo "Explicit production CI requested for exact main ${current_sha}"

  browser-acceptance:
    name: Six-role browser acceptance (explicit Main QA only)
    needs: fast
    # Run only after explicit QA opt-in; regular push/PR and production stay unchanged.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_six_role_acceptance == true && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[qa-main]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      E2E_BASE_URL: https://uptilldawn-main.uptilldawn.workers.dev
      E2E_ALLOW_MAIN_TEST: '1'
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_ADMINISTRATION_EMAIL: ${{ secrets.E2E_ADMINISTRATION_EMAIL }}
      E2E_ADMINISTRATION_PASSWORD: ${{ secrets.E2E_ADMINISTRATION_PASSWORD }}
      E2E_PROMOTION_EMAIL: ${{ secrets.E2E_PROMOTION_EMAIL }}
      E2E_PROMOTION_PASSWORD: ${{ secrets.E2E_PROMOTION_PASSWORD }}
      E2E_STAFF_EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
      E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
      E2E_RESPONSIBLE_EMAIL: ${{ secrets.E2E_RESPONSIBLE_EMAIL }}
      E2E_RESPONSIBLE_PASSWORD: ${{ secrets.E2E_RESPONSIBLE_PASSWORD }}
      E2E_MAKER_EMAIL: ${{ secrets.E2E_MAKER_EMAIL }}
      E2E_MAKER_PASSWORD: ${{ secrets.E2E_MAKER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Verify all isolated QA account secrets are present
        shell: bash
        run: |
          set -euo pipefail
          required=(E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD E2E_ADMINISTRATION_EMAIL E2E_ADMINISTRATION_PASSWORD E2E_PROMOTION_EMAIL E2E_PROMOTION_PASSWORD E2E_STAFF_EMAIL E2E_STAFF_PASSWORD E2E_RESPONSIBLE_EMAIL E2E_RESPONSIBLE_PASSWORD E2E_MAKER_EMAIL E2E_MAKER_PASSWORD)
          for key in "${required[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing dedicated main-test QA secret: $key (no production account should be used)."
              exit 1
            fi
          done
          echo "All six QA account credentials are configured (values withheld)."
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Install browser and Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Run six-role browser acceptance
        run: npm run e2e:portals
      - name: Crawl every static Main page as all six QA roles
        run: node scripts/main-adversarial-auth-crawl.mjs
      - name: Upload QA screenshots and structured result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: six-role-browser-acceptance
          path: |
            test-results/final-acceptance/
            test-results/main-adversarial/
          if-no-files-found: ignore
          retention-days: 7
