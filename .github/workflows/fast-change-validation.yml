name: Fast Change Validation

on:
  push:
    branches: [staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: fast-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Parallel lint, typecheck and unit tests
        shell: bash
        run: |
          set -uo pipefail
          npm run lint > /tmp/fast-lint.log 2>&1 & lint_pid=$!
          npm run typecheck > /tmp/fast-typecheck.log 2>&1 & types_pid=$!
          npm test > /tmp/fast-tests.log 2>&1 & tests_pid=$!
          failed=0
          for entry in "lint:$lint_pid" "typecheck:$types_pid" "tests:$tests_pid"; do
            label="${entry%%:*}"
            pid="${entry#*:}"
            if wait "$pid"; then
              echo "PASS: $label"
            else
              echo "::error::$label failed"
              failed=1
            fi
            cat "/tmp/fast-$label.log"
          done
          exit "$failed"
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high
