name: CI main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_production:
        description: 'Explicit owner-authorized production release: dispatch full CI production after successful fast CI main'
        type: boolean
        required: true
        default: false

concurrency:
  group: fast-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Enforce exactly five approved workflow files
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            '.github/workflows/ci.yml' \
            '.github/workflows/cleanup-actions-history.yml' \
            '.github/workflows/deploy-cloudflare.yml' \
            '.github/workflows/deploy-main.yml' \
            '.github/workflows/fast-change-validation.yml' | sort)"
          actual="$(find .github/workflows -maxdepth 1 -type f | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Only the five approved GitHub Actions workflows may exist."
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          echo "Approved workflow inventory: exactly five files"
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Examine vinext 1.4.5 compatibility without modifying Main or package files
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'explore/vinext-workers-free-compat-20261115' }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          echo 'vinext compatibility scan only — no init, package change or deployment'
          npx --yes vinext@1.4.5 check | tee /tmp/main-vinext-check.log
          {
            echo '## vinext compatibility exploration'
            echo 'This command scanned existing source only; no deployment performed.'
            echo 'Check the vinext compatibility scan job log for findings.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Parallel lint, typecheck and unit tests
        shell: bash
        run: |
          set -uo pipefail
          npm run lint > /tmp/fast-lint.log 2>&1 & lint_pid=$!
          npm run typecheck > /tmp/fast-typecheck.log 2>&1 & types_pid=$!
          npm test > /tmp/fast-tests.log 2>&1 & tests_pid=$!
          failed=0
          for entry in "lint:$lint_pid" "typecheck:$types_pid" "tests:$tests_pid"; do
            label="${entry%%:*}"
            pid="${entry#*:}"
            if wait "$pid"; then
              echo "PASS: $label"
            else
              echo "::error::$label failed"
              failed=1
            fi
            cat "/tmp/fast-$label.log"
          done
          exit "$failed"
      - name: Inventory every Main page and API route
        run: node scripts/main-adversarial-surface.mjs --inventory-only
      - name: Audit requested product functionality against committed code and tests
        run: node scripts/main-requirements-audit.mjs
      - name: Final six-role acceptance inventory (static evidence only)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/final-main-acceptance-inventory.mjs
          {
            echo '## Main final acceptance (static inventory)'
            echo 'Six role source surfaces and four-locales browser harness: present'
            echo 'Authenticated end-to-end journeys: not executed in this fast CI'
            echo 'Live provider delivery, disaster recovery and mobile device acceptance: unverified'
            echo 'Full release approval remains blocked pending separate evidence.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: Compile vinext in disposable CI checkout (no deployment)
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'explore/vinext-workers-free-compat-20261115' }}
        timeout-minutes: 10
        shell: bash
        env:
          CI: '1'
        run: |
          set -euo pipefail
          echo 'Ephemeral migration build only — no Workers credentials or deployment'
          npx --yes vinext@1.4.5 init --platform=cloudflare --cdn-cache=none --data-cache=none --image-optimization=none --no-prerender --ignore-wrangler-config
          npm run build:vinext
          echo 'Vinext production compilation completed in temporary PR checkout'
      - name: Exercise vinext preview HTTP routes without deploying or changing data
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'explore/vinext-workers-free-compat-20261115' }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          echo 'Read-only vinext Vite preview probe, no Cloudflare token or actual login credentials'
          npm run start:vinext -- --host 127.0.0.1 --port 8788 >/tmp/vinext-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              echo '::error::vinext preview process exited before readiness'
              tail -50 /tmp/vinext-preview.log
              exit 1
            fi
            code="$(curl -sS --max-time 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:8788/login/staff || true)"
            if [ "$code" = '200' ]; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo '::error::vinext preview failed to serve /login/staff'
            tail -70 /tmp/vinext-preview.log
            exit 1
          fi
          for path in /login/staff /login/admin /login/promotion /login/administration /login/responsible; do
            status="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "http://127.0.0.1:8788$path" || true)"
            echo "$path => HTTP $status"
            test "$status" = 200 || { echo "::error::vinext public login route failed: $path"; exit 1; }
          done
          for path in /events /god-mode /portals/administration/finance; do
            status="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "http://127.0.0.1:8788$path" || true)"
            echo "Unauthenticated $path => HTTP $status"
            case "$status" in
              301|302|303|307|308|401|403) ;;
              *) echo "::error::vinext protected route not denied as expected: $path ($status)"; exit 1;;
            esac
          done
          echo 'Vinext anonymous GET and protected-route deny smoke tests passed'
  release-production:
    needs: fast
    # Only a manual, explicit release input may dispatch full CI production.
    # Ordinary Main pushes, pull requests and commit markers NEVER trigger production.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_production == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch production CI after successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Require the exact validated current main commit; prevent unintended release after branch drift.
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "${current_sha}" != "${GITHUB_SHA}" ]; then
            echo "::error::Main advanced to ${current_sha}; explicit release SHA was ${GITHUB_SHA}"
            exit 1
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" -f ref=main
          echo "Explicit production CI requested for exact main ${current_sha}"

