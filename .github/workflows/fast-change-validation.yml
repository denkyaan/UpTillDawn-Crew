name: CI main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_production:
        description: 'Explicit owner-authorized production release: dispatch full CI production after successful fast CI main'
        type: boolean
        required: true
        default: false

concurrency:
  group: fast-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Enforce exactly five approved workflow files
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            '.github/workflows/ci.yml' \
            '.github/workflows/cleanup-actions-history.yml' \
            '.github/workflows/deploy-cloudflare.yml' \
            '.github/workflows/deploy-main.yml' \
            '.github/workflows/fast-change-validation.yml' | sort)"
          actual="$(find .github/workflows -maxdepth 1 -type f | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Only the five approved GitHub Actions workflows may exist."
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          echo "Approved workflow inventory: exactly five files"
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Parallel lint, typecheck and unit tests
        shell: bash
        run: |
          set -uo pipefail
          npm run lint > /tmp/fast-lint.log 2>&1 & lint_pid=$!
          npm run typecheck > /tmp/fast-typecheck.log 2>&1 & types_pid=$!
          npm test > /tmp/fast-tests.log 2>&1 & tests_pid=$!
          failed=0
          for entry in "lint:$lint_pid" "typecheck:$types_pid" "tests:$tests_pid"; do
            label="${entry%%:*}"
            pid="${entry#*:}"
            if wait "$pid"; then
              echo "PASS: $label"
            else
              echo "::error::$label failed"
              failed=1
            fi
            cat "/tmp/fast-$label.log"
          done
          exit "$failed"
      # Every PR can affect the shared original-source Vite runtime (including
      # fixes outside migration/*). Catch syntax/type errors BEFORE merging to
      # Main, not after the original Main Worker is already deployed. This
      # does not run on Main pushes or add any expensive browser stages.
      - name: Fast isolated modern TypeScript safety check on pull requests
        if: ${{ github.event_name == 'pull_request' }}
        # Build the same candidate as Deploy main, not an accidentally
        # tree-shaken "unset VITE_*" bundle that can underreport size.
        env:
          VITE_SUPABASE_URL: https://npbjrtiolqperdgljnhi.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_zStTw3n8wZ271PehDRDvGg_rs0JOy84
          VITE_MIGRATION_ALLOW_WRITES: 'false'
          VITE_MIGRATION_SCANNING_ENABLED: 'false'
          E2E_MAIN_MODERN_QA_ORIGIN: https://uptilldawn-modern-main.uptilldawn.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix modern install --prefer-offline --no-audit --no-fund
          # The deploy-modern-main-qa job installs ONLY modern dependencies.
          # Root npm ci used by ordinary fast checks previously masked broken
          # imports from ../lib/* that cannot resolve dependencies in deploy.
          # Atomically hide root node_modules for the whole isolated candidate
          # check, then always restore it for later CI steps.
          test -d node_modules
          test ! -e .upt-root-node-modules-isolation
          mv node_modules .upt-root-node-modules-isolation
          trap 'mv .upt-root-node-modules-isolation node_modules' EXIT
          # Always enforce the REAL candidate gzip budget on PRs that share
          # original Main CSS/auth/components. Previously non-migration PRs
          # passed while the post-merge modern deploy failed by just 32 bytes.
          # Vite builds locally on this GitHub runner, never on Workers Free.
          npm --prefix modern run build
          npm --prefix modern run budget
          npm --prefix modern run worker:standalone-check
          # Compile a separate non-deployable production-shaped bundle without production secrets.
          if [[ "$GITHUB_HEAD_REF" == migration/* ]]; then
            npm --prefix modern run worker:production-rehearsal
          fi
          # The lightweight action/API/authorization contracts must be green
          # BEFORE merging. Previously Main CI was green while the post-merge
          # modern QA Worker failed its own tests.
          npm --prefix modern run api:test
          npm --prefix modern run bundle:seven
          node --check modern/tests/deep-route-parity-qa.mjs
          node --check modern/tests/qa-native-fixture-transactions.mjs
          node --check modern/tests/login-parity-qa.mjs
          node --check modern/tests/qa-all-action-write-denials.mjs
      - name: Upload non-deploying migration build evidence
        if: ${{ always() && github.event_name == 'pull_request' && startsWith(github.head_ref, 'migration/') }}
        uses: actions/upload-artifact@v4
        with:
          name: migration-build-preflight
          path: |
            test-results/modern-standalone-preflight/
            test-results/modern-seven-bundle/
          if-no-files-found: warn
          retention-days: 5
      - name: Read isolated Main Worker runtime outcomes for diagnostic PRs
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'diagnostic/main-runtime') && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/main-worker-outcomes.mjs
      # Candidate-only build gate. Never slows ordinary Main CI/deploy; the
      # current production app remains Next/OpenNext until the full parity gate.
      - name: Validate isolated Vite/Hono migration build
        if: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'migration/') || startsWith(github.head_ref, 'diagnostic/main-runtime')) }}
        shell: bash
        run: |
          set -euo pipefail
          # Previous PR step installed, typechecked, built, budget-checked and tested
          # the exact QA bundle. Reuse those outputs instead of rebuilding it.
          npm --prefix modern run worker:check
          npm --prefix modern run inventory
          npm --prefix modern run rpc:contract
          npm --prefix modern audit --omit=dev --audit-level=high
      # Isolated migration PR only. Main fast CI remains unchanged.
      - name: Candidate anonymous browser acceptance (4 languages x 2 device profiles)
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'migration/') }}
        shell: bash
        run: |
          set -euo pipefail
          # Reuse the exact QA build, with all non-local browser traffic blocked.
          # Headless Chromium only; avoid apt package downloads on each CI run.
          npx playwright install chromium --only-shell
          npm --prefix modern run browser:test
      # Full 56-role/locale/device browser comparisons and 30-session load
      # intentionally run in the explicit opt-in QA jobs of Deploy main, not
      # during fast PR CI. They hit the same Free-tier legacy Main baseline and
      # can experience transient 503s; running them here repeatedly exhausted
      # this job's 15-minute timeout and caused cancelled PR checks.
      # Keep static/build/unit/auth-denial gates above and preserve the separate
      # comprehensive release/cutover acceptance requirements.
      - name: Inventory every Main page and API route
        run: node scripts/main-adversarial-surface.mjs --inventory-only
      - name: Audit requested product functionality against committed code and tests
        run: node scripts/main-requirements-audit.mjs
      - name: Final six-role acceptance inventory (static evidence only)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/final-main-acceptance-inventory.mjs
          {
            echo '## Main final acceptance (static inventory)'
            echo 'Six role source surfaces and four-locales browser harness: present'
            echo 'Authenticated end-to-end journeys: not executed in this fast CI'
            echo 'Live provider delivery, disaster recovery and mobile device acceptance: unverified'
            echo 'Full release approval remains blocked pending separate evidence.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high
  release-production:
    needs: fast
    # Only a manual, explicit release input may dispatch full CI production.
    # Ordinary Main pushes, pull requests and commit markers NEVER trigger production.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_production == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch production CI after successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Require the exact validated current main commit; prevent unintended release after branch drift.
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "${current_sha}" != "${GITHUB_SHA}" ]; then
            echo "::error::Main advanced to ${current_sha}; explicit release SHA was ${GITHUB_SHA}"
            exit 1
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" -f ref=main
          echo "Explicit production CI requested for exact main ${current_sha}"

