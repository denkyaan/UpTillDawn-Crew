name: Isolated Staging Preview

on:
  push:
    branches:
      - rebuild/interactive-role-training
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptilldawn-staging
  cancel-in-progress: true

jobs:
  needs-staging-database:
    if: ${{ vars.UPT_TEST_SUPABASE_URL == '' || vars.UPT_TEST_SUPABASE_ANON_KEY == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: State why staging is not deployed
        run: |
          echo "::notice::No staging deploy: supply UPT_TEST_SUPABASE_URL and UPT_TEST_SUPABASE_ANON_KEY from a separate Supabase test project in repository Actions variables."
          echo "Never point this preview workflow at production Supabase."

  deploy:
    if: ${{ vars.UPT_TEST_SUPABASE_URL != '' && vars.UPT_TEST_SUPABASE_ANON_KEY != '' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.UPT_TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.UPT_TEST_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_APP_URL: https://uptilldawn-crew-staging.uptilldawn.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout tested branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Enforce strict staging isolation
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          case "$NEXT_PUBLIC_SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "::error::Invalid staging Supabase project URL"; exit 1 ;;
          esac
          if [ "$NEXT_PUBLIC_SUPABASE_URL" = "https://eakoavcieossazqzplke.supabase.co" ]; then
            echo "::error::Refusing to connect staging to the production database"
            exit 1
          fi
          if [ "$NEXT_PUBLIC_APP_URL" = "https://crew.uptilldawn.workers.dev" ]; then
            echo "::error::Refusing to use the production app URL"
            exit 1
          fi
          grep -q '"name": "uptilldawn-crew-staging"' wrangler.staging.jsonc
          echo "Separate Worker and database configuration confirmed."
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check lint
        run: npm run lint
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run regressions
        run: npm test
      - name: Build staging Cloudflare bundle
        run: npm run build:cloudflare
      - name: Inspect staging upload
        run: npx wrangler deploy --dry-run --config wrangler.staging.jsonc --var "NEXT_PUBLIC_SUPABASE_URL:$NEXT_PUBLIC_SUPABASE_URL" --var "NEXT_PUBLIC_SUPABASE_ANON_KEY:$NEXT_PUBLIC_SUPABASE_ANON_KEY" --var "NEXT_PUBLIC_APP_URL:$NEXT_PUBLIC_APP_URL"
      - name: Publish separate staging Worker only
        run: npx wrangler deploy --config wrangler.staging.jsonc --var "NEXT_PUBLIC_SUPABASE_URL:$NEXT_PUBLIC_SUPABASE_URL" --var "NEXT_PUBLIC_SUPABASE_ANON_KEY:$NEXT_PUBLIC_SUPABASE_ANON_KEY" --var "NEXT_PUBLIC_APP_URL:$NEXT_PUBLIC_APP_URL"
      - name: Verify deployed staging login and PWA resources
        shell: bash
        run: |
          set -euo pipefail
          for path in /login /manifest.webmanifest /sw.js; do
            body="$(mktemp)"
            code="$(curl --max-time 25 -L -sS -o "$body" -w '%{http_code}' "$NEXT_PUBLIC_APP_URL$path")"
            echo "$path: HTTP $code"
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ] || [ ! -s "$body" ]; then
              echo "::error::Staging smoke test failed: $path"
              exit 1
            fi
          done
          echo "Staging preview URL: $NEXT_PUBLIC_APP_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Staging database: isolated Supabase project" >> "$GITHUB_STEP_SUMMARY"
