name: Deploy Staging

on:
  workflow_dispatch:
  push:
    branches: [staging]

concurrency:
  group: uptilldawn-staging
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    permissions:
      contents: read
      actions: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://npbjrtiolqperdgljnhi.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_APP_URL: https://uptilldawn-crew-staging.uptilldawn.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Verify staging configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$NEXT_PUBLIC_SUPABASE_URL" = "https://npbjrtiolqperdgljnhi.supabase.co"
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Validate
        run: |
          npm run lint
          npm run typecheck
          npm test
      - name: Require successful 15-bot integration CI for exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          target="$GITHUB_SHA"
          echo "Waiting for V2.1 integration and 15 authenticated browser bots on $target"
          for attempt in $(seq 1 90); do
            result=$(gh api "repos/$GH_REPO/actions/workflows/v21-staging-integration-ci.yml/runs?head_sha=$target&per_page=30" --jq '[.workflow_runs[] | select(.head_sha == "'$target'" and .event == "push")] | sort_by(.created_at) | last | [.status,.conclusion] | @tsv')
            status=$(printf '%s' "$result" | cut -f1)
            conclusion=$(printf '%s' "$result" | cut -f2)
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "PASS: complete bot integration gate succeeded for $target"
                exit 0
              fi
              echo "::error::Bot integration gate failed: $conclusion"
              exit 1
            fi
            echo "Bot integration gate: ${status:-pending} (attempt $attempt/90)"
            sleep 30
          done
          echo "::error::Timed out waiting for 15-bot integration gate; deployment blocked"
          exit 1
      - name: Build staging Worker
        run: npm run build:cloudflare
      - name: Staging dry-run
        run: npx wrangler deploy --dry-run --config wrangler.staging.jsonc
      - name: Deploy staging only
        run: npx wrangler deploy --config wrangler.staging.jsonc
      - name: Configure staging-only self-healing dispatcher
        shell: bash
        env:
          SELF_HEALING_GITHUB_TOKEN: ${{ secrets.STAGING_SELF_HEALING_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${SELF_HEALING_GITHUB_TOKEN:-}" ]; then
            printf '%s' "$SELF_HEALING_GITHUB_TOKEN" | npx wrangler secret put SELF_HEALING_GITHUB_TOKEN --config wrangler.staging.jsonc
          else
            echo 'Staging AI dispatcher not configured; autonomous dispatch disabled.'
          fi
      - name: Staging HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          for path in / /login/admin /login/responsible /login/staff /manifest.webmanifest; do
            code=$(curl -sSL -o /dev/null -w '%{http_code}' --retry 4 --retry-delay 2 "${NEXT_PUBLIC_APP_URL}${path}")
            echo "$path: $code"
            test "$code" -ge 200 && test "$code" -lt 400
          done
